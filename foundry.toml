[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
evm_version = "london"
optimizer = true
optimizer_runs = 100
# the planner vectors test writes one fixture the web tests read
fs_permissions = [{ access = "write", path = "web/src/lib/__fixtures__" }]
# the planner vectors test builds hundreds of positions in one test, which is more than the default 1,073,741,824 gas
gas_limit = 9223372036854775807
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "musd/=lib/musd/solidity/contracts/",
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
matsnet = "https://rpc.test.mezo.org"
# read only, used by the pinned-block fork tests in test/fork
mezo_mainnet = "https://rpc-http.mezo.boar.network"

[profile.deep.invariant]
runs = 256
depth = 200
