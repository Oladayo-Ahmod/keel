name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - name: Build
        run: forge build
      # the app's ABI file is generated from this build; fail if it was not regenerated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App ABI is up to date
        run: |
          (cd web && node scripts/generate-abi-v2.mjs ../out)
          git diff --exit-code web/src/abi/trozu.ts
      - name: Test
        run: forge test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Mezo Passport's own dependencies declare old React peers
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # a production build refuses a missing or local site URL, so share images never point at localhost.
      # This is a placeholder for CI; the deployed site sets its own (see docs/web.md, Share cards).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://trozu-ci.example
      - name: No test-only wallet in the production build
        run: npm run check:no-e2e

  keeper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
