name: keeper

# Runs the Trozu guardian keeper on a schedule. It reads the chain, asks each vault's own planner
# whether execute() would act, and sends it where it would. It needs one repository secret,
# KEEPER_PRIVATE_KEY (a dedicated testnet key holding a little BTC for gas). Without the secret
# the job falls back to a dry run, so a fork or a missing secret never fails the schedule.
#
# GitHub's scheduler is best effort: runs can be delayed by several minutes, and scheduled
# workflows on a repository with no activity for 60 days are paused until re-enabled.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and estimate only, send nothing"
        type: boolean
        default: true

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - name: Install
        run: npm ci
      - name: Run keeper
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          RPC_URL: ${{ vars.KEEPER_RPC_URL }}
          # a manual run defaults to dry; a scheduled run is live only if the secret exists
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: |
          if [ -z "$KEEPER_PRIVATE_KEY" ]; then
            echo "KEEPER_PRIVATE_KEY secret is not set: running as a dry run"
            DRY_RUN=1
          fi
          export DRY_RUN
          npm run keeper
